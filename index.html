<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* ============================================================
   RAAG — DESIGN TOKENS
   ============================================================ */
:root {
  --bg-pure: #000000;
  --bg-canvas: #0a0a0a;
  --bg-surface-elevated: #121212;
  --bg-surface-subtle: #181818;
  --bg-surface-field: #141414;

  --text-primary: #ffffff;
  --text-secondary: #a3a3a3;
  --text-tertiary: #737373;
  --accent-stone: #e5e5e5;

  --border-hairline: rgba(255,255,255,0.12);
  --border-subtle: rgba(255,255,255,0.06);
  --border-focus: #ffffff;

  --state-sale: #ff3b30;
  --state-success: #34c759;

  --font-display: 'Syne', sans-serif;
  --font-body: 'Hanken Grotesk', sans-serif;
  --font-mono: 'JetBrains Mono', monospace;

  --xs: 0.25rem; --sm: 0.5rem; --md: 1rem; --lg: 1.5rem;
  --xl: 2rem; --xxl: 3rem; --xxxl: 4.5rem; --xxxxl: 6rem;
  --gutter: 1.25rem; --max-editorial: 1440px; --drawer-width: 440px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { background: var(--bg-canvas); scroll-behavior: smooth; overflow-x: hidden; }
body {
  background: var(--bg-canvas);
  color: var(--text-primary);
  font-family: var(--font-body);
  font-size: 0.9375rem;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
  overflow-x: hidden;
  max-width: 100%;
}
img, svg { display: block; max-width: 100%; }
a { color: inherit; text-decoration: none; }
button { font-family: inherit; cursor: pointer; }
ul { list-style: none; }
input, textarea, select { font-family: inherit; background: none; border: none; color: inherit; max-width: 100%; box-sizing: border-box; }
:focus-visible { outline: 1.5px solid #fff; outline-offset: 2px; }

/* Type scale */
.t-display-hero { font-family: var(--font-display); font-weight: 800; font-size: clamp(2.1rem, 11vw, 2.75rem); line-height: 1.0; letter-spacing: -0.03em; }
@media(min-width:1024px){ .t-display-hero { font-size: 5rem; line-height: 0.95; letter-spacing: -0.04em; } }
.t-headline-xl { font-family: var(--font-display); font-weight: 700; font-size: 1.875rem; line-height: 1.1; letter-spacing: -0.02em; }
@media(min-width:1024px){ .t-headline-xl { font-size: 3rem; line-height: 1.05; letter-spacing: -0.03em; } }
.t-headline-lg { font-family: var(--font-display); font-weight: 700; font-size: 1.5rem; line-height: 1.2; letter-spacing: -0.02em; }
@media(min-width:1024px){ .t-headline-lg { font-size: 1.875rem; } }
.t-headline-md { font-family: var(--font-body); font-weight: 600; font-size: 1.25rem; line-height: 1.3; letter-spacing: -0.01em; }
.t-body-lg { font-family: var(--font-body); font-weight: 400; font-size: 1.125rem; line-height: 1.6; }
.t-body-md { font-family: var(--font-body); font-weight: 400; font-size: 0.9375rem; line-height: 1.5; }
.t-body-sm { font-family: var(--font-body); font-weight: 400; font-size: 0.8125rem; line-height: 1.4; letter-spacing: 0.01em; }
.t-label-caps { font-family: var(--font-body); font-weight: 600; font-size: 0.75rem; line-height: 1; letter-spacing: 0.14em; text-transform: uppercase; }
.t-label-mono { font-family: var(--font-mono); font-weight: 400; font-size: 0.6875rem; line-height: 1.2; letter-spacing: 0.08em; }
.t-price { font-family: var(--font-mono); font-weight: 500; font-size: 1rem; line-height: 1.2; letter-spacing: 0.02em; }

.container {
  width: 100%;
  max-width: var(--max-editorial);
  margin: 0 auto;
  padding: 0 var(--gutter);
  box-sizing: border-box;
}
@media(min-width:640px)  { .container { padding: 0 2rem; } }
@media(min-width:1024px) { .container { padding: 0 3rem; } }
@media(min-width:1280px) { .container { padding: 0 4rem; } }

/* ============================================================
   NAVBAR & BRANDING LOGO
   ============================================================ */
.navbar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 500;
  height: 56px;
  background: rgba(10,10,10,0.92);
  backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
  border-bottom: 1px solid var(--border-subtle);
  display: flex; align-items: center;
  transition: background 320ms ease, box-shadow 320ms ease, height 320ms ease;
}
@media(min-width:1024px){ .navbar { height: 64px; } }
.navbar.scrolled {
  background: rgba(5,5,5,0.97);
  box-shadow: 0 1px 0 rgba(255,255,255,0.08);
}
.nav-inner {
  width: 100%; max-width: var(--max-editorial); margin: 0 auto;
  padding: 0 var(--gutter);
  display: flex; align-items: center; justify-content: space-between;
  height: 100%;
  position: relative;
}
@media(min-width:640px)  { .nav-inner { padding: 0 2rem; } }
@media(min-width:1024px) { .nav-inner { padding: 0 3rem; } }
@media(min-width:1280px) { .nav-inner { padding: 0 4rem; } }

.nav-left { display: flex; align-items: center; gap: var(--xl); height: 100%; }
.nav-left .nav-link { display: none; }
@media(min-width:1024px){ .nav-left .nav-link { display: block; } }

.nav-right { display: flex; align-items: center; gap: 0.5rem; height: 100%; }
@media(min-width:1024px){ .nav-right { gap: var(--lg); } }

.nav-link {
  font-family: var(--font-body); font-weight: 600; font-size: 0.75rem;
  letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-secondary);
  position: relative; padding: 4px 0; transition: color 200ms ease;
}
.nav-link::after {
  content: ''; position: absolute; left: 0; right: 100%; bottom: -2px; height: 1px;
  background: #fff; transition: right 220ms ease-out;
}
.nav-link:hover, .nav-link.active { color: var(--text-primary); }
.nav-link:hover::after, .nav-link.active::after { right: 0; }

.nav-logo-text {
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 1.15rem;
  letter-spacing: 0.22em;
  color: var(--text-primary);
  text-transform: uppercase;
  user-select: none;
  transition: opacity 200ms ease;
  white-space: nowrap;
  
  /* Absolute center for mobile */
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
}
@media(min-width:1024px){
  .nav-logo-text { font-size: 1.35rem; letter-spacing: 0.26em; }
}
.nav-logo-text:hover { opacity: 0.85; }

.nav-icon-btn {
  background: none; border: none; color: var(--text-primary);
  display: flex; align-items: center; justify-content: center;
  width: 36px; height: 36px; position: relative;
  -webkit-tap-highlight-color: transparent;
}
.nav-icon-btn svg { width: 18px; height: 18px; }
@media(min-width:1024px){ .nav-icon-btn svg { width: 19px; height: 19px; } }
.cart-badge {
  position: absolute; top: 0; right: -2px;
  font-family: var(--font-mono); font-size: 0.5625rem;
  background: #fff; color: #000; min-width: 15px; height: 15px; padding: 0 3px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 0;
}
.hamburger {
  display: flex; background: none; border: none; color: #fff;
  width: 36px; height: 36px; align-items: center; justify-content: center;
  -webkit-tap-highlight-color: transparent;
  flex-shrink: 0;
}
.hamburger svg { width: 20px; height: 20px; }
@media(min-width:1024px){ .hamburger { display: none !important; } }
.nav-right .account-desktop { display: none; }
@media(min-width:1024px){ .nav-right .account-desktop { display: flex; align-items: center; gap: var(--lg); } }

/* Mobile menu */
.mobile-menu {
  position: fixed; inset: 0; z-index: 600;
  background: var(--bg-pure);
  transform: translateX(100%); transition: transform 280ms ease-out;
  display: flex; flex-direction: column;
  padding: var(--xl) var(--gutter);
}
.mobile-menu.open { transform: translateX(0); }
.mobile-menu-top { display: flex; justify-content: flex-end; margin-bottom: var(--xxxl); }
.mobile-menu ul { display: flex; flex-direction: column; gap: var(--xl); }
.mobile-menu a {
  font-family: var(--font-display); font-weight: 700; font-size: 1.875rem;
  color: var(--text-secondary); transition: color 200ms ease;
}
.mobile-menu a.active, .mobile-menu a:hover { color: var(--text-primary); }

/* ============================================================
   BUTTONS
   ============================================================ */
.btn {
  display: inline-flex; align-items: center; justify-content: center;
  height: 44px; padding: 0 1.75rem;
  font-family: var(--font-body); font-weight: 600; font-size: 0.75rem;
  letter-spacing: 0.1em; text-transform: uppercase;
  border-radius: 0; border: 1px solid transparent;
  transition: background 220ms ease-out, color 220ms ease-out, border-color 220ms ease-out, box-shadow 220ms ease-out;
  white-space: nowrap;
}
@media(min-width:1024px){ .btn { height: 48px; } }
.btn-primary { background: #fff; color: #000; }
.btn-primary:hover { background: #e5e5e5; box-shadow: 0 0 0 1px #fff; }
.btn-primary:disabled { background: #3a3a3a; color: #777; cursor: not-allowed; box-shadow: none; }
.btn-secondary { background: var(--bg-canvas); border-color: rgba(255,255,255,0.3); color: #fff; }
.btn-secondary:hover { background: #fff; color: #000; }
.btn-block { width: 100%; }
.btn-link {
  flex-shrink: 0;
  white-space: nowrap;
}

/* ============================================================
   PRODUCT CARDS & GRID
   ============================================================ */
.product-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}
@media(min-width:480px){ .product-grid { gap: 16px; } }
@media(min-width:768px){ .product-grid { grid-template-columns: repeat(3, 1fr); gap: 24px; } }
@media(min-width:1024px){ .product-grid { grid-template-columns: repeat(4, 1fr); gap: 28px; } }
.product-grid > * { min-width: 0; }

/* Homepage showcase rows (Collection / Top Sellers) — always exactly 3 per line on tablet+ */
@media(min-width:768px){ .product-grid-3 { grid-template-columns: repeat(3, 1fr) !important; } }
@media(min-width:1024px){ .product-grid-3 { grid-template-columns: repeat(3, 1fr) !important; gap: 28px; } }

.product-card { display: block; cursor: pointer; text-decoration: none; color: inherit; }
.product-media {
  position: relative; aspect-ratio: 3 / 4;
  background: radial-gradient(circle at 50% 35%, #222222 0%, #121212 60%, #060606 100%);
  overflow: hidden; border: 1px solid var(--border-subtle);
  transition: border-color 220ms ease;
}
.product-card:hover .product-media { border-color: rgba(255, 255, 255, 0.28); }
.product-media .ph-base, .product-media .ph-alt {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  transition: opacity 300ms ease-out;
}
.product-media .ph-alt { opacity: 0; }
.product-card:hover .ph-alt { opacity: 1; }
.product-card:hover .ph-base { opacity: 0; }

.garment-svg {
  width: 48%; max-height: 70%;
  opacity: 0.7; filter: drop-shadow(0 8px 24px rgba(0,0,0,0.85));
  z-index: 2; position: relative;
  transition: transform 300ms ease, opacity 300ms ease;
}
.product-card:hover .garment-svg { transform: scale(1.04); opacity: 0.85; }

.badge {
  position: absolute; top: var(--sm); left: var(--sm); z-index: 5;
  font-family: var(--font-mono); font-size: 0.625rem; letter-spacing: 0.08em;
  padding: 4px 8px; border: 1px solid rgba(255,255,255,0.2); background: rgba(10,10,10,0.85);
  backdrop-filter: blur(4px); text-transform: uppercase; color: var(--text-primary);
}
.badge.sale { color: var(--state-sale); border-color: rgba(255,59,48,0.4); }
.product-meta { padding-top: var(--sm); }
.product-title {
  font-family: var(--font-body); font-weight: 500; font-size: 0.8125rem;
  letter-spacing: 0.03em; text-transform: uppercase; color: var(--text-primary);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
@media(min-width:768px){ .product-title { font-size: 0.875rem; } }
.product-cat { color: var(--text-tertiary); font-size: 0.75rem; margin-top: 2px; }
.product-price { font-family: var(--font-mono); font-weight: 500; font-size: 0.8125rem; margin-top: 4px; color: var(--accent-stone); }
@media(min-width:768px){ .product-price { font-size: 0.875rem; } }

/* ============================================================
   SECTIONS & HERO
   ============================================================ */
.page { padding-top: 56px; }
@media(min-width:1024px){ .page { padding-top: 64px; } }
.section { padding: var(--xxl) 0; }
@media(min-width:1024px){ .section { padding: var(--xxxl) 0; } }
.hairline-top { border-top: 1px solid var(--border-hairline); }
.eyebrow { color: var(--text-tertiary); }
/* HERO — NEW EDITORIAL HERO (natural model/environment photo) */
.hero {
  position: relative;
  width: 100%;
  height: 92vh;
  min-height: 520px;
  max-height: 900px;
  border-bottom: 1px solid var(--border-hairline);
  overflow: hidden;
}

.hero-img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center 10%;
  display: block;
}

/* Cinematic gradient overlay */
.hero::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(
    to bottom,
    rgba(0,0,0,0.10) 0%,
    rgba(0,0,0,0.06) 40%,
    rgba(0,0,0,0.38) 70%,
    rgba(0,0,0,0.72) 100%
  );
  pointer-events: none;
  z-index: 1;
}

/* Hero text content block */
.hero-content {
  position: absolute;
  bottom: 10%;
  left: 6%;
  z-index: 5;
  color: #fff;
  max-width: 560px;
}
.hero-eyebrow {
  font-family: var(--font-mono);
  font-size: 0.6875rem;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.6);
  margin-bottom: 0.8rem;
  display: flex;
  align-items: center;
  gap: 0.6rem;
}
.hero-eyebrow::before {
  content: '';
  display: inline-block;
  width: 28px;
  height: 1px;
  background: rgba(255,255,255,0.45);
}
.hero-title {
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 2.5rem; /* ← FIXED: clamp hata diya, mobile pe consistent */
  line-height: 1.0;
  letter-spacing: -0.035em;
  color: #fff;
  margin-bottom: 1rem;
}
.hero-title em {
  font-style: italic;
  font-weight: 700;
}
.hero-sub {
  font-family: var(--font-body);
  font-size: 0.9rem; /* ← FIXED: clamp hata diya, mobile pe readable */
  color: rgba(255,255,255,0.68);
  line-height: 1.55;
  margin-bottom: 2rem;
  max-width: 360px;
}
.hero-cta-btn {
  display: inline-flex;
  align-items: center;
  gap: 0.75rem;
  font-family: var(--font-body);
  font-weight: 600;
  font-size: 0.6875rem;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: #fff;
  border: 1px solid rgba(255,255,255,0.5);
  padding: 0 1.75rem;
  height: 46px;
  background: rgba(255,255,255,0.07);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  transition: background 240ms ease, border-color 240ms ease, letter-spacing 240ms ease;
  cursor: pointer;
  text-decoration: none;
}
.hero-cta-btn:hover {
  background: rgba(255,255,255,0.15);
  border-color: rgba(255,255,255,0.88);
  letter-spacing: 0.18em;
}
.hero-cta-btn svg {
  width: 14px;
  height: 14px;
  transition: transform 240ms ease;
  flex-shrink: 0;
}
.hero-cta-btn:hover svg { transform: translateX(4px); }

/* Hero scroll indicator */
.hero-scroll-hint {
  position: absolute;
  bottom: 2.2rem;
  right: 6%;
  z-index: 5;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.4rem;
  color: rgba(255,255,255,0.35);
  font-family: var(--font-mono);
  font-size: 0.5625rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}
.hero-scroll-hint::after {
  content: '';
  display: block;
  width: 1px;
  height: 34px;
  background: linear-gradient(to bottom, rgba(255,255,255,0.38), transparent);
  animation: scrollPulse 2.2s ease-in-out infinite;
}
@keyframes scrollPulse {
  0%, 100% { opacity: 0.35; transform: scaleY(1); }
  50% { opacity: 0.9; transform: scaleY(1.18); }
}

/* ← FIXED: Mobile media queries */
@media(min-width: 1024px) {
  .hero-title { font-size: 4.2rem; }
  .hero-sub { font-size: 0.9375rem; }
}
@media(max-width: 1023px) {
  .hero { height: 80vh; }
  .hero-img { object-position: 65% center; }
  .hero-content { bottom: 8%; left: 5%; }
}
@media(max-width: 767px) {
  .hero {
    height: 100svh;
    min-height: 500px;
  }
  /* Model is on RIGHT side of image — shift right to show him */
  .hero-img { object-position: 70% center; }
  .hero-content {
    bottom: 6%;
    left: 1.25rem;
    right: 1.25rem;
    max-width: none;
  }
  .hero-scroll-hint { display: none; }
  .hero-sub { max-width: 100%; }
  .hero-title { font-size: 2rem; }
  .hero-cta-btn { height: 42px; font-size: 0.625rem; padding: 0 1.25rem; }
}
@media(max-width: 374px) {
  .hero-title { font-size: 1.75rem; }
  .hero-img { object-position: 72% center; }
}

/* Editorial / lookbook */
.lookbook-grid { display: grid; grid-template-columns: 1fr; gap: var(--md); }
@media(min-width:768px){ .lookbook-grid { grid-template-columns: 1fr 1fr; } }
.lookbook-block { aspect-ratio: 4/5; background: #111; border: 1px solid var(--border-subtle); position: relative; overflow: hidden; }
.lookbook-block::before {
  content: ""; position: absolute; inset: 0;
  background: radial-gradient(ellipse at 50% 40%, rgba(40,40,40,0.6) 0%, rgba(10,10,10,0.95) 80%);
  z-index: 1; pointer-events: none;
}
.lookbook-block::after {
  content: ""; position: absolute; inset: -50%;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.06'/%3E%3C/svg%3E");
  opacity: 0.9; mix-blend-mode: overlay; pointer-events: none; z-index: 2;
}
.lookbook-block.tall { aspect-ratio: 3/4; }
.brand-statement { max-width: 640px; }

/* Instagram / social proof strip */
.insta-strip-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
@media(min-width:640px){ .insta-strip-grid { grid-template-columns: repeat(4, 1fr); gap: 16px; } }
.insta-tile {
  aspect-ratio: 1/1; position: relative; overflow: hidden;
  background: radial-gradient(circle at 50% 35%, #1c1c1c 0%, #101010 60%, #050505 100%);
  border: 1px solid var(--border-subtle); display: flex; align-items: center; justify-content: center;
  transition: border-color 220ms ease, transform 300ms ease;
}
.insta-tile:hover { border-color: rgba(255,255,255,0.28); transform: translateY(-3px); }
.insta-tile svg { width: 34%; opacity: 0.55; }
.insta-tile .insta-overlay {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  background: rgba(0,0,0,0); transition: background 220ms ease;
}
.insta-tile:hover .insta-overlay { background: rgba(0,0,0,0.35); }
.insta-tile .insta-hover-icon {
  opacity: 0; transform: scale(0.8); transition: opacity 220ms ease, transform 220ms ease;
  width: 22px; height: 22px; color: #fff;
}
.insta-tile:hover .insta-hover-icon { opacity: 1; transform: scale(1); }

/* Reviews */
.rating-stars { display: inline-flex; gap: 2px; color: #f5c542; }
.rating-stars svg { width: 14px; height: 14px; }
.review-summary-row { display: flex; align-items: center; gap: var(--sm); flex-wrap: wrap; }
.review-grid { display: grid; grid-template-columns: 1fr; gap: var(--md); }
@media(min-width:768px){ .review-grid { grid-template-columns: repeat(3, 1fr); } }
.review-card {
  border: 1px solid var(--border-subtle); background: var(--bg-surface-field);
  padding: var(--lg); display: flex; flex-direction: column; gap: var(--sm);
}
.review-card-head { display: flex; align-items: center; justify-content: space-between; gap: var(--sm); }
.review-author { font-weight: 600; font-size: 0.8125rem; }
.review-verified {
  font-family: var(--font-mono); font-size: 0.625rem; letter-spacing: 0.06em;

.reveal {

  transform: translateY(28px);
  transition: opacity 0.7s cubic-bezier(0.22, 1, 0.36, 1),
              transform 0.7s cubic-bezier(0.22, 1, 0.36, 1);
  will-change: opacity, transform;
}
.reveal.reveal-left {
  transform: translateX(-28px);
}
.reveal.reveal-right {
  transform: translateX(28px);
}
.reveal.reveal-scale {
  transform: scale(0.94);
}
.reveal.visible {
  opacity: 1;
  transform: translateY(0) translateX(0) scale(1);
}

.reveal-group .reveal:nth-child(1) { transition-delay: 0ms; }
.reveal-group .reveal:nth-child(2) { transition-delay: 80ms; }
.reveal-group .reveal:nth-child(3) { transition-delay: 160ms; }

function startCountdown(durationMinutes) {
  let endTime = localStorage.getItem('raag_promo_end');
  if (!endTime) {
    endTime = new Date().getTime() + durationMinutes * 60000;
    localStorage.setItem('raag_promo_end', endTime);
  }
  
  if (timerInterval) clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    const now = new Date().getTime();
    const distance = parseInt(endTime) - now;
    
    if (distance < 0) {
      clearInterval(timerInterval);
      document.getElementById('announcementTimerEl').innerText = "00:00";
      return;
    }
    
    const m = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
    const s = Math.floor((distance % (1000 * 60)) / 1000);
    document.getElementById('announcementTimerEl').innerText = String(m).padStart(2, '0') + ":" + String(s).padStart(2, '0');
  }, 1000);
}

/* ============================================================
   IMAGE HELPERS — Display Real Photography or Refined Fallback
   ============================================================ */
// Normalizes whatever the API/database actually returns for a product's
// image data into a clean array of URL strings — without touching the
// stored value itself. This is purely a read-side safeguard against the
// common real-world variations that make a correctly-stored image fail
// to render: the field already being an array (the expected shape), a
// JSON-encoded string (some drivers return JSON/array columns as raw
// text), a comma-separated string, or the URL(s) living under a
// differently-named key than "images".
function resolveProductImages(p) {
  if (!p) return [];
  let raw = p.images;
  if (raw === undefined || raw === null) {
    raw = p.image_url || p.imageUrl || p.image_urls || p.imageUrls || p.photos || p.photo_urls || p.image || null;
  }
  if (raw === undefined || raw === null) return [];
  if (typeof raw === "string") {
    const trimmed = raw.trim();
    if (!trimmed) return [];
    if (trimmed.startsWith("[")) {
      try {
        const parsed = JSON.parse(trimmed);
        raw = Array.isArray(parsed) ? parsed : [trimmed];
      } catch (e) {
        raw = trimmed.split(",").map(s => s.trim());
      }
    } else if (trimmed.includes(",")) {
      raw = trimmed.split(",").map(s => s.trim());
    } else {
      raw = [trimmed];
    }
  }
  if (!Array.isArray(raw)) return [];
  return raw.filter(u => typeof u === "string" && u.trim().length > 0);
}

// Renders a real photo with a hidden glyph fallback right behind it.
// The fallback is only ever revealed by handleMediaImgError below, i.e.
// only on a genuine load failure — never shown ahead of a real image.
function mediaWithFallback(url, alt, glyph, extraAttrs) {
  return `<div style="width:100%; height:100%; position:relative;">
    <img src="${url}" alt="${alt}" style="width:100%; height:100%; object-fit:contain; object-position:center center; position:relative;" loading="lazy" ${extraAttrs || ""} onerror="handleMediaImgError(this)" />
    <div style="display:none; position:absolute; inset:0; align-items:center; justify-content:center;">${glyph}</div>
  </div>`;
}
function handleMediaImgError(imgEl) {
  imgEl.style.display = "none";
  const fallback = imgEl.nextElementSibling;
  if (fallback) fallback.style.display = "flex";
}

function getProductMediaBase(p) {
  const imgs = resolveProductImages(p);
  return imgs.length > 0
    ? mediaWithFallback(imgs[0], p.name, (p && p.glyph) ? p.glyph : GLYPHS.jacket)
    : (p && p.glyph ? p.glyph : GLYPHS.jacket);
}
function getProductMediaAlt(p) {
  if (!p) return GLYPHS.jacket;
  const imgs = resolveProductImages(p);
  const src = imgs.length > 1 ? imgs[1] : (imgs.length > 0 ? imgs[0] : null);
  return src
    ? mediaWithFallback(src, p.name, p.glyph || GLYPHS.jacket)
    : (p.glyph || GLYPHS.jacket);
}
function getProductMediaCart(p) {
  const imgs = resolveProductImages(p);
  return imgs.length > 0
    ? mediaWithFallback(imgs[0], p.name, (p && p.glyph) ? p.glyph : GLYPHS.jacket)
    : (p && p.glyph ? p.glyph : GLYPHS.jacket);
}
function getProductMediaMainPdp(p) {
  const imgs = resolveProductImages(p);
  return imgs.length > 0
    ? mediaWithFallback(imgs[0], p.name, p.glyph || GLYPHS.jacket, 'id="pdpMainImage"')
    : `<div style="width:48%; display:flex; justify-content:center; align-items:center; height:100%;">${p.glyph || GLYPHS.jacket}</div>`;
}
function getProductMediaThumbPdp(p, idx) {
  const imgs = resolveProductImages(p);
  if (imgs.length > idx) {
    return mediaWithFallback(imgs[idx], p.name, (p && p.glyph) ? p.glyph : GLYPHS.jacket);
  }
  return `<div style="width:50%; display:flex; justify-content:center; align-items:center; height:100%; ${idx===1?'opacity:0.6;':''}">${p ? p.glyph : GLYPHS.jacket}</div>`;
}

function updateQty(productId, size, delta){
  const line = cart.find(l => l.productId === productId && l.size === size);

  line.qty += delta;

  saveCart();
  renderCartBadge(); renderDrawer(); if(currentRoute === "/cart") render();
}

}

function cartSubtotal(){ return cart.reduce((s,l)=>{ const p = getProduct(l.productId); return s + (p ? p.price*l.qty : 0); },0); }
function cartPromoSubtotal(){ 
  if(!appliedPromoCode) return cartSubtotal();
  return cart.reduce((s,l)=>{ 
    const p = getProduct(l.productId); 
    const priceToUse = (p && p.promoPrice) ? p.promoPrice : (p ? p.price : 0);
    return s + (priceToUse * l.qty);
  }, 0); 
}

function buildWhatsAppMessage(order){

  lines.push("");

  lines.push("");
  lines.push("Customer:");

  lines.push(`Phone: ${order.phone}`);
  if(order.email) lines.push(`Email: ${order.email}`);
  lines.push("");
  lines.push("Order:");
  order.items.forEach(item=>{
    const p = getProduct(item.productId);
    lines.push("");
    lines.push(p ? p.name : item.productId);
    lines.push(`Size: ${item.size}`);
    lines.push(`Quantity: ${item.qty}`);
    if(p) lines.push(`Price: ${formatPrice(p.price)}`);
  });
  lines.push("");
  lines.push("Delivery:");
  lines.push(formatPrice(order.deliveryCharges));
  lines.push("");
  lines.push("Total:");
  lines.push(formatPrice(order.total));
  lines.push("");
  lines.push("Shipping Address:");
  lines.push(order.address);
  lines.push(order.city);
  lines.push(order.province);
  if(order.postalCode) lines.push(order.postalCode);
  lines.push("");
  lines.push("Payment:");
  lines.push("Cash On Delivery");
  return lines.join("\n");
}

/* ============================================================
   ROUTER & NAVIGATION ACTIVE STATE
   ============================================================ */
let currentRoute = "/";
let routeParam = null;

function parseHash(){
  let h = window.location.hash.replace(/^#/, "");
  if(!h) h = "/";
  const parts = h.split("/").filter(Boolean);
  return parts;
}

function navigate(){
  const parts = parseHash();
  window.scrollTo(0,0);
  if(parts.length === 0){ currentRoute = "/"; routeParam = null; }
  else if(parts[0] === "product"){ currentRoute = "/product"; routeParam = parts[1]; }
  else if(parts[0] === "admin"){
    if(!adminAuthed){
      window.location.hash = "#/login";
      return;
    }
    currentRoute = "/admin"; routeParam = parts[1] || "dashboard";
  }
  else { currentRoute = "/" + parts[0]; routeParam = parts[1] || null; }

  // Update navbar & mobile-menu active states
  document.querySelectorAll(".nav-link, .mobile-link").forEach(link => {
    const href = link.getAttribute("href");
    const isMatch = (currentRoute === "/" && (href === "#/" || href === "#")) ||
                    (currentRoute !== "/" && href === "#" + currentRoute);
    if (isMatch) {
      link.classList.add("active");
    } else {
      link.classList.remove("active");
    }
  });

  closeMobileMenu();
  render();
}

  const matches = PRODUCTS.filter(p => p.name.toLowerCase().includes(q) || p.category.toLowerCase().includes(q));

  return `<span class="rating-stars">${out}</span>`;
}

function submitReview(e, productId) {
  e.preventDefault();
  const formData = new FormData(e.target);
  const review = {
    id: 'rev-' + Date.now(),
    productId,
    customerName: formData.get('customerName'),
    rating: parseInt(formData.get('rating'), 10),
    comment: formData.get('comment'),
    date: new Date().toISOString()
  };
  MOCK_REVIEWS.unshift(review);
  try { localStorage.setItem('raag_reviews', JSON.stringify(MOCK_REVIEWS)); } catch(err) {}
  showToast("Thank you for your review!");
  e.target.reset();
  render();
}

function swapPdpImage(el, idx) {

  const imgs = resolveProductImages(currentPdpProduct);
  if (mainImg && imgs[idx]) {

async function handlePlaceOrder(e){
  e.preventDefault();
  const form = e.target;
  const data = Object.fromEntries(new FormData(form).entries());

  let hasError = false;
  ["customerName","phone","address","city","province"].forEach(name=>{
    const input = form.querySelector(`[name="${name}"]`);
    if(!data[name] || !data[name].trim()){
      hasError = true;
      input.style.borderColor = "var(--state-sale)";
    } else {
      input.style.borderColor = "";
    }
  });
  if(hasError){ showToast("Please fill in required fields"); return false; }

  const subtotal = cartSubtotal();
  const promoSubtotal = cartPromoSubtotal();
  const delivery = STORE_CONFIG.deliveryCharge;
  const order = {
    orderId: generateOrderId(),
    customerName: data.customerName.trim(),
    phone: data.phone.trim(),
    email: (data.email||"").trim(),
    address: data.address.trim(),
    city: data.city.trim(),
    province: data.province,
    postalCode: (data.postalCode||"").trim(),
    whatsapp: (data.whatsapp||"").trim(),
    notes: (data.notes||"").trim(),
    items: cart.map(l=>({productId:l.productId, size:l.size, qty:l.qty})),
    subtotal: subtotal, 
    deliveryCharges: delivery, 
    total: promoSubtotal+delivery,
    promoCode: appliedPromoCode,
    paymentMethod: "Cash on Delivery",
    createdAt: new Date().toISOString(),
    status: "New"
  };

  const btn = form.querySelector('button[type="submit"]');
  const prevText = btn.textContent;
  btn.textContent = "Placing Order...";
  btn.disabled = true;

  const waTab = window.open('about:blank', '_blank');

  // Always save order locally first
  try {
    const savedOrders = JSON.parse(localStorage.getItem('raag_orders') || '[]');
    savedOrders.unshift(order);
    localStorage.setItem('raag_orders', JSON.stringify(savedOrders));
    MOCK_ORDERS = savedOrders;
  } catch(e) {}

  // Try to send to API (works on Vercel)
  try {
    const res = await fetch('/api/orders', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(order)
    });
    if (!res.ok) throw new Error("API Error");
  } catch (err) {
    // Silently ignore — order is already saved locally
  }

  if (waTab) waTab.location.href = buildWhatsAppUrl(order);
  lastOrder = order;
  cart = [];
  saveCart();
  renderCartBadge();
  window.location.hash = "#/checkout";
  render();

  return false;
}

    } else {

      if (saved) MOCK_CUSTOMERS = JSON.parse(saved);
    }

  const prevText = btn.textContent;

  btn.disabled = true;

  const emailInput = (data.email || '').trim().toLowerCase();
  const passInput = (data.password || '').trim();

  // Admin login check for Admin1123@raag.com / raag@me72
  if ((emailInput === 'admin1123@raag.com' || emailInput.includes('admin')) && passInput === 'raag@me72') {
    sessionStorage.setItem('admin_key', passInput);
    adminAuthed = true;
    await loadAdminData();
    window.location.hash = "#/admin/dashboard";
    btn.textContent = prevText;
    btn.disabled = false;
    return false;
  }

  try {
    const res = await fetch("/api/auth", { headers: { "x-admin-key": passInput } });
    if(res.ok){
      sessionStorage.setItem('admin_key', passInput);
      adminAuthed = true;
      await loadAdminData();
      window.location.hash = "#/admin/dashboard";
    } else {

    }
  } catch(ex) {
    if (passInput === 'raag@me72') {
      sessionStorage.setItem('admin_key', passInput);
      adminAuthed = true;
      await loadAdminData();
      window.location.hash = "#/admin/dashboard";
    } else {
      document.getElementById("siteLoginError").style.display = "block";
    }
  }
  btn.textContent = prevText;
  btn.disabled = false;
  return false;
}

function exportOrdersToExcel(){
  if(typeof XLSX === "undefined"){
    showToast("Export unavailable offline — needs an internet connection");
    return;
  }
  const rows = MOCK_ORDERS.map(o=>({
    "Order ID": o.id,
    "Customer": o.customerName || o.customer || "",
    "Phone": o.phone,
    "Email": o.email || "",
    "Address": o.address,
    "City": o.city,
    "Province": o.province,
    "Items": Array.isArray(o.items) ? o.items.map(i=>i.productId+' x'+i.qty).join(', ') : (o.items || ""),
    "Total": o.total,
    "Payment Method": o.paymentMethod || "Cash on Delivery",
    "Status": o.status,
    "Date": o.createdAt || o.date || ""
  }));
  const ws = XLSX.utils.json_to_sheet(rows);
  ws["!cols"] = [
    {wch:20},{wch:20},{wch:14},{wch:22},{wch:28},{wch:14},{wch:12},{wch:40},{wch:10},{wch:16},{wch:12},{wch:12}
  ];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Orders");
  const stamp = new Date().toISOString().slice(0,10);
  XLSX.writeFile(wb, `raag-orders-${stamp}.xlsx`);
}

async function updateOrderStatus(orderId, status) {
  const o = MOCK_ORDERS.find(x=>(x.orderId||x.id)===orderId);
  if(o) o.status = status;
  render();
  try {
    await fetch('/api/orders', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ orderId, status })
    });
  } catch(e) {
    showToast("Failed to update status");
  }
}

async function deleteOrder(orderId) {
  if (!confirm(`Delete order ${orderId}? This cannot be undone.`)) return;
  try {
    const res = await fetch('/api/orders?id=' + encodeURIComponent(orderId), { method: 'DELETE' });
    const text = await res.text();
    let data = {};
    try { data = text ? JSON.parse(text) : {}; } catch (_) {}
    
    if (!res.ok) {
      if (text.includes("METHOD")) throw new Error("Server needs restart to apply API changes.");
      throw new Error(data.error || 'Failed to delete order');
    }
    
    MOCK_ORDERS = MOCK_ORDERS.filter(o => (o.orderId || o.id) !== orderId);
    render();
    showToast('Order deleted');
  } catch(e) {
    showToast(e.message || 'Failed to delete order');
  }
}

  const soldOut = document.getElementById("adminProdSoldOut").checked;
  const sizesRaw = document.getElementById("adminProdSizes").value;
  const oosRaw = document.getElementById("adminProdOOS").value;
  const bestSeller = document.getElementById("adminProdBestSeller").checked;
  const limited = document.getElementById("adminProdLimited").checked;
  
  const sizesArr = sizesRaw ? sizesRaw.split(",").map(s=>s.trim()).filter(Boolean) : ["S","M","L"];
  const oosArr = oosRaw ? oosRaw.split(",").map(s=>s.trim()).filter(Boolean) : [];

  let p = null;
  let isEdit = false;
  
  if(editingProductId){
    p = getProduct(editingProductId);
    if(p) {
      p.name = name || p.name;
      p.price = isNaN(price) ? p.price : price;
      p.compareAt = compareAt;
      p.promoPrice = promoPrice;
      p.soldOut = soldOut;
      p.sizes = sizesArr;
      p.outOfStockSizes = oosArr;
      p.bestSeller = bestSeller;
      p.limited = limited;
      isEdit = true;
    }
  } else {
    const newId = "prod-" + Math.floor(Math.random()*10000);
    p = {
      id: newId,
      name: name || "New Product",
      category: "Category",
      price: isNaN(price) ? 0 : price,
      compareAt: compareAt,
      promoPrice: promoPrice,
      glyph: GLYPHS.jacket,
      images: [],
      sizes: sizesArr,
      outOfStockSizes: oosArr,
      bestSeller: bestSeller,
      limited: false,
      soldOut: soldOut,
      edition: "DROP 004",
      description: "A new piece added to the collection.",
      details: ["Refined tailoring", "Heavyweight fabric"],
      sizeGuide: "Fits true to size.",
      shipping: "Express shipping.",
      returns: "Standard returns."
    };
    PRODUCTS.unshift(p);
  }
  
  // Save product metadata (without images) to database first
  // Strip base64 images from the payload to avoid size issues
  const productForDB = { ...p };
  if (Array.isArray(productForDB.images)) {
    productForDB.images = productForDB.images.filter(img => typeof img === 'string' && !img.startsWith('data:'));
  }
  
  try {
    const res = await fetch('/api/products', {
      method: isEdit ? 'PUT' : 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(productForDB)
    });
    if (!res.ok) {
      const txt = await res.text();
      let errStr = txt;
      try { errStr = JSON.parse(txt).error || txt; } catch(_){}
      console.warn("DB sync failed:", errStr);
    }
  } catch(e) {
    console.warn("DB sync skipped (running locally or no connection):", e.message);
  }

  // Now handle image uploads via /api/upload
  const frontFile = document.getElementById("adminProdFrontImg")?.files[0];
  const backFile = document.getElementById("adminProdBackImg")?.files[0];
  
  if (frontFile || backFile) {
    if (imgStatus) imgStatus.textContent = 'Uploading images...';
    
    try {
      if (frontFile) {
        if (imgStatus) imgStatus.textContent = 'Compressing front image...';
        const frontData = await adminCompressImage(frontFile);
        if (imgStatus) imgStatus.textContent = 'Uploading front image...';
        const result = await fetch('/api/upload', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ productId: p.id, imageData: frontData, slot: 0 })
        });
        if (result.ok) {
          const data = await result.json();
          if (data.images) p.images = data.images;
        } else {
          const err = await result.json().catch(() => ({}));
          console.warn("Front image upload failed:", err.error);
          showToast("Front image upload failed: " + (err.error || "Unknown error"));
        }
      }
      
      if (backFile) {
        if (imgStatus) imgStatus.textContent = 'Compressing back image...';
        const backData = await adminCompressImage(backFile);
        if (imgStatus) imgStatus.textContent = 'Uploading back image...';
        const result = await fetch('/api/upload', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ productId: p.id, imageData: backData, slot: 1 })
        });
        if (result.ok) {
          const data = await result.json();
          if (data.images) p.images = data.images;
        } else {
          const err = await result.json().catch(() => ({}));
          console.warn("Back image upload failed:", err.error);
          showToast("Back image upload failed: " + (err.error || "Unknown error"));
        }
      }
      
      if (imgStatus) imgStatus.textContent = '✅ Images uploaded!';
    } catch(e) {
      console.warn("Image upload error:", e.message);
      if (imgStatus) imgStatus.textContent = '❌ Image upload failed: ' + e.message;
    }
  }
  
  closeAdminModal();
  saveProductsLocal();
  render();
  showToast(isEdit ? "Product updated" : "Product added");
  if (saveBtn) saveBtn.disabled = false;
}

// Compress image for admin upload
function adminCompressImage(file, maxWidth = 1200, maxHeight = 1600, quality = 0.82) {
  return new Promise((resolve, reject) => {
    if (!file) return resolve(null);
    const reader = new FileReader();
    reader.readAsDataURL(file);
    reader.onload = (event) => {
      const img = new Image();
      img.onload = () => {
        let width = img.width;
        let height = img.height;
        if (width > maxWidth || height > maxHeight) {
          const ratio = Math.min(maxWidth / width, maxHeight / height);
          width = Math.round(width * ratio);
          height = Math.round(height * ratio);
        }
        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = error => reject(error);
      img.src = event.target.result;
    };
    reader.onerror = error => reject(error);
  });
}

/* ============================================================
   SCROLL REVEAL — IntersectionObserver
   ============================================================ */
function initScrollAnimations() {
  const reveals = document.querySelectorAll('.reveal:not(.visible)');
  if (!reveals.length) return;

  if ('IntersectionObserver' in window) {
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('visible');
          observer.unobserve(entry.target);
        }
      });
    }, { threshold: 0.1, rootMargin: '0px 0px -30px 0px' });

    reveals.forEach(el => observer.observe(el));
  } else {
    reveals.forEach(el => el.classList.add('visible'));
  }
}

function initProductGridReveal() {
  document.querySelectorAll('.reveal-group .product-card, .reveal-group .lookbook-block').forEach(el => {
    if (!el.classList.contains('reveal')) {
      el.classList.add('reveal');
    }
  });
  initScrollAnimations();
}

/* ============================================================
   NAVBAR — SCROLL AWARE
   ============================================================ */
(function() {
  const nav = document.querySelector('.navbar');
  if (!nav) return;
  window.addEventListener('scroll', () => {
    if (window.scrollY > 30) {
      nav.classList.add('scrolled');
    } else {
      nav.classList.remove('scrolled');
    }
  }, { passive: true });
})();
