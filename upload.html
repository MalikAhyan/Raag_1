<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Upload Product Images - RAAG</title>
<style>
  body {
    background: #000;
    color: #fff;
    font-family: sans-serif;
    padding: 2rem;
  }
  .container {
    max-width: 600px;
    margin: 0 auto;
    background: #111;
    padding: 2rem;
    border: 1px solid #333;
  }
  h1 { font-size: 1.5rem; margin-bottom: 1.5rem; }
  .field { margin-bottom: 1.5rem; }
  label { display: block; margin-bottom: 0.5rem; font-size: 0.85rem; color: #aaa; text-transform: uppercase; }
  select, input[type="file"] {
    width: 100%;
    padding: 0.75rem;
    background: #222;
    border: 1px solid #444;
    color: #fff;
    box-sizing: border-box;
  }
  button {
    background: #fff;
    color: #000;
    padding: 0.75rem 1.5rem;
    border: none;
    cursor: pointer;
    font-weight: bold;
    text-transform: uppercase;
  }
  button:hover { background: #ddd; }
  button:disabled { background: #555; color: #888; cursor: not-allowed; }
  #status { margin-top: 1rem; color: #4caf50; }
  #error { margin-top: 1rem; color: #f44336; }
  .preview-row { display: flex; gap: 1rem; margin-bottom: 1.5rem; }
  .preview-box {
    flex: 1;
    aspect-ratio: 3/4;
    background: #1a1a1a;
    border: 1px dashed #444;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }
  .preview-box img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .preview-label {
    font-size: 0.7rem;
    color: #666;
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }
  .progress-bar {
    width: 100%;
    height: 4px;
    background: #333;
    margin-top: 0.5rem;
    display: none;
  }
  .progress-bar .fill {
    height: 100%;
    background: #4caf50;
    width: 0%;
    transition: width 0.3s;
  }
  .current-images { margin-bottom: 1.5rem; }
  .current-images h3 { font-size: 0.85rem; color: #888; margin-bottom: 0.5rem; text-transform: uppercase; }
</style>
</head>
<body>

<div class="container">
  <h1>Upload Product Images</h1>
  
  <div class="field">
    <label>Select Product</label>
    <select id="productSelect" onchange="onProductSelected()">
      <option value="">Loading products...</option>
    </select>
  </div>

  <div class="current-images" id="currentImages" style="display:none;">
    <h3>Current Images</h3>
    <div class="preview-row" id="currentPreviewRow"></div>
  </div>

  <div class="field">
    <label>Front Image (Default)</label>
    <input type="file" id="frontImage" accept="image/*" onchange="previewFile('frontImage','frontPreview')" />
  </div>

  <div class="field">
    <label>Back Image (Hover effect)</label>
    <input type="file" id="backImage" accept="image/*" onchange="previewFile('backImage','backPreview')" />
  </div>

  <div class="preview-row">
    <div class="preview-box" id="frontPreview"><span class="preview-label">Front Preview</span></div>
    <div class="preview-box" id="backPreview"><span class="preview-label">Back Preview</span></div>
  </div>

  <button id="uploadBtn" onclick="uploadImages()">Upload</button>
  
  <div class="progress-bar" id="progressBar"><div class="fill" id="progressFill"></div></div>
  <div id="status"></div>
  <div id="error"></div>
</div>

<script>
let products = [];

async function loadProducts() {
  try {
    const res = await fetch('/api/products');
    if (res.ok) {
      products = await res.json();
    } else {
      throw new Error('Failed to fetch from API');
    }
  } catch (e) {
    const local = localStorage.getItem('raag_products');
    if (local) {
      products = JSON.parse(local);
    }
  }

  const select = document.getElementById('productSelect');
  select.innerHTML = '<option value="">-- Choose a Product --</option>';
  products.forEach(p => {
    const opt = document.createElement('option');
    opt.value = p.id;
    opt.textContent = p.name + ' (' + p.id + ')';
    select.appendChild(opt);
  });
}

function onProductSelected() {
  const productId = document.getElementById('productSelect').value;
  const container = document.getElementById('currentImages');
  const row = document.getElementById('currentPreviewRow');
  
  if (!productId) {
    container.style.display = 'none';
    return;
  }

  const product = products.find(p => p.id === productId);
  if (!product) {
    container.style.display = 'none';
    return;
  }

  let images = product.images || [];
  if (typeof images === 'string') {
    try { images = JSON.parse(images); } catch(e) { images = []; }
  }

  // Filter out base64 and empty strings - only show real URLs
  const realImages = images.filter(img => typeof img === 'string' && img.trim() && !img.startsWith('data:'));
  
  if (realImages.length === 0) {
    row.innerHTML = '<span class="preview-label">No images uploaded yet</span>';
  } else {
    row.innerHTML = realImages.map((url, i) => 
      `<div class="preview-box"><img src="${url}" alt="${i === 0 ? 'Front' : 'Back'}" /></div>`
    ).join('');
  }
  container.style.display = 'block';
}

function previewFile(inputId, previewId) {
  const file = document.getElementById(inputId).files[0];
  const previewEl = document.getElementById(previewId);
  if (!file) return;
  
  const reader = new FileReader();
  reader.onload = (e) => {
    previewEl.innerHTML = `<img src="${e.target.result}" alt="Preview" />`;
  };
  reader.readAsDataURL(file);
}

function compressImage(file, maxWidth = 1200, maxHeight = 1600, quality = 0.82) {
  return new Promise((resolve, reject) => {
    if (!file) return resolve(null);
    const reader = new FileReader();
    reader.readAsDataURL(file);
    reader.onload = (event) => {
      const img = new Image();
      img.onload = () => {
        let width = img.width;
        let height = img.height;
        
        if (width > maxWidth || height > maxHeight) {
          const ratio = Math.min(maxWidth / width, maxHeight / height);
          width = Math.round(width * ratio);
          height = Math.round(height * ratio);
        }
        
        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        
        const compressedBase64 = canvas.toDataURL('image/jpeg', quality);
        resolve(compressedBase64);
      };
      img.onerror = error => reject(error);
      img.src = event.target.result;
    };
    reader.onerror = error => reject(error);
  });
}

async function uploadSingleImage(productId, imageData, slot) {
  const res = await fetch('/api/upload', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ productId, imageData, slot })
  });
  
  if (!res.ok) {
    const errBody = await res.json().catch(() => ({ error: 'Upload failed' }));
    throw new Error(errBody.error || 'Upload failed with status ' + res.status);
  }
  
  return await res.json();
}

async function uploadImages() {
  const statusEl = document.getElementById('status');
  const errorEl = document.getElementById('error');
  const progressBar = document.getElementById('progressBar');
  const progressFill = document.getElementById('progressFill');
  const uploadBtn = document.getElementById('uploadBtn');
  
  statusEl.textContent = '';
  errorEl.textContent = '';

  const productId = document.getElementById('productSelect').value;
  if (!productId) {
    errorEl.textContent = 'Please select a product.';
    return;
  }

  const frontFile = document.getElementById('frontImage').files[0];
  const backFile = document.getElementById('backImage').files[0];

  if (!frontFile && !backFile) {
    errorEl.textContent = 'Please select at least one image to upload.';
    return;
  }

  uploadBtn.disabled = true;
  progressBar.style.display = 'block';
  progressFill.style.width = '10%';

  try {
    let totalSteps = (frontFile ? 1 : 0) + (backFile ? 1 : 0);
    let completedSteps = 0;

    if (frontFile) {
      statusEl.textContent = 'Compressing front image...';
      progressFill.style.width = '20%';
      const frontData = await compressImage(frontFile);
      
      statusEl.textContent = 'Uploading front image to server...';
      progressFill.style.width = '40%';
      await uploadSingleImage(productId, frontData, 0);
      completedSteps++;
      progressFill.style.width = (completedSteps / totalSteps * 80 + 20) + '%';
    }

    if (backFile) {
      statusEl.textContent = 'Compressing back image...';
      const backData = await compressImage(backFile);
      
      statusEl.textContent = 'Uploading back image to server...';
      progressFill.style.width = '80%';
      await uploadSingleImage(productId, backData, 1);
      completedSteps++;
    }

    progressFill.style.width = '100%';
    statusEl.textContent = '✅ Images uploaded successfully! They will now show on ALL devices.';
    
    // Clear inputs
    document.getElementById('frontImage').value = '';
    document.getElementById('backImage').value = '';
    document.getElementById('frontPreview').innerHTML = '<span class="preview-label">Front Preview</span>';
    document.getElementById('backPreview').innerHTML = '<span class="preview-label">Back Preview</span>';

    // Reload products to show updated images
    await loadProducts();
    onProductSelected();

    setTimeout(() => {
      progressBar.style.display = 'none';
      progressFill.style.width = '0%';
    }, 3000);

  } catch (err) {
    errorEl.textContent = '❌ Error: ' + err.message;
    progressBar.style.display = 'none';
  } finally {
    uploadBtn.disabled = false;
  }
}

loadProducts();
</script>

</body>
</html>
