<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Upload Product Images - RAAG</title>
<style>
  body {
    background: #000;
    color: #fff;
    font-family: sans-serif;
    padding: 2rem;
  }
  .container {
    max-width: 600px;
    margin: 0 auto;
    background: #111;
    padding: 2rem;
    border: 1px solid #333;
  }
  h1 { font-size: 1.5rem; margin-bottom: 1.5rem; }
  .field { margin-bottom: 1.5rem; }
  label { display: block; margin-bottom: 0.5rem; font-size: 0.85rem; color: #aaa; text-transform: uppercase; }
  select, input[type="file"] {
    width: 100%;
    padding: 0.75rem;
    background: #222;
    border: 1px solid #444;
    color: #fff;
    box-sizing: border-box;
  }
  button {
    background: #fff;
    color: #000;
    padding: 0.75rem 1.5rem;
    border: none;
    cursor: pointer;
    font-weight: bold;
    text-transform: uppercase;
  }
  button:hover { background: #ddd; }
  #status { margin-top: 1rem; color: #4caf50; }
  #error { margin-top: 1rem; color: #f44336; }
</style>
</head>
<body>

<div class="container">
  <h1>Upload Product Images</h1>
  
  <div class="field">
    <label>Select Product</label>
    <select id="productSelect">
      <option value="">Loading products...</option>
    </select>
  </div>

  <div class="field">
    <label>Front Image (Default)</label>
    <input type="file" id="frontImage" accept="image/*" />
  </div>

  <div class="field">
    <label>Back Image (Hover effect)</label>
    <input type="file" id="backImage" accept="image/*" />
  </div>

  <button onclick="uploadImages()">Upload</button>
  
  <div id="status"></div>
  <div id="error"></div>
</div>

<script>
let products = [];

async function loadProducts() {
  try {
    const res = await fetch('/api/products');
    if (res.ok) {
      products = await res.json();
    } else {
      throw new Error('Failed to fetch from API');
    }
  } catch (e) {
    const local = localStorage.getItem('raag_products');
    if (local) {
      products = JSON.parse(local);
    }
  }

  const select = document.getElementById('productSelect');
  select.innerHTML = '<option value="">-- Choose a Product --</option>';
  products.forEach(p => {
    const opt = document.createElement('option');
    opt.value = p.id;
    opt.textContent = p.name + ' (' + p.id + ')';
    select.appendChild(opt);
  });
}

function compressImage(file, maxWidth = 1200, maxHeight = 1600, quality = 0.8) {
  return new Promise((resolve, reject) => {
    if (!file) return resolve(null);
    const reader = new FileReader();
    reader.readAsDataURL(file);
    reader.onload = (event) => {
      const img = new Image();
      img.onload = () => {
        let width = img.width;
        let height = img.height;
        
        if (width > maxWidth || height > maxHeight) {
          const ratio = Math.min(maxWidth / width, maxHeight / height);
          width = Math.round(width * ratio);
          height = Math.round(height * ratio);
        }
        
        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        
        const compressedBase64 = canvas.toDataURL('image/jpeg', quality);
        resolve(compressedBase64);
      };
      img.onerror = error => reject(error);
      img.src = event.target.result;
    };
    reader.onerror = error => reject(error);
  });
}

async function uploadImages() {
  const statusEl = document.getElementById('status');
  const errorEl = document.getElementById('error');
  statusEl.textContent = '';
  errorEl.textContent = '';

  const productId = document.getElementById('productSelect').value;
  if (!productId) {
    errorEl.textContent = 'Please select a product.';
    return;
  }

  const frontFile = document.getElementById('frontImage').files[0];
  const backFile = document.getElementById('backImage').files[0];

  if (!frontFile && !backFile) {
    errorEl.textContent = 'Please select at least one image to upload.';
    return;
  }

  statusEl.textContent = 'Processing images...';

  try {
    const frontBase64 = await compressImage(frontFile);
    const backBase64 = await compressImage(backFile);

    const product = products.find(p => p.id === productId);
    if (!product) throw new Error('Product not found in local array');

    // Make sure we have an array
    if (!Array.isArray(product.images)) {
      product.images = [];
    }

    if (frontBase64) {
      product.images[0] = frontBase64;
    }
    if (backBase64) {
      product.images[1] = backBase64;
    }

    // Update local storage
    localStorage.setItem('raag_products', JSON.stringify(products));

    // Try API PUT
    try {
      const res = await fetch('/api/products', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(product)
      });
      if (!res.ok) {
        console.warn('API sync failed, but saved locally.');
      }
    } catch (e) {
      console.warn('API sync failed, saved locally only.');
    }

    statusEl.textContent = 'Images uploaded successfully!';
    
    // Clear inputs
    document.getElementById('frontImage').value = '';
    document.getElementById('backImage').value = '';

  } catch (err) {
    errorEl.textContent = 'Error: ' + err.message;
  }
}

loadProducts();
</script>

</body>
</html>
